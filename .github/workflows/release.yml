name: Release

# The org release pipeline (swarm-routing/.github reusable-release.yml;
# CONTRIBUTING "Cutting a release" there), #10:
#   dispatch `dry-run`  bump, build, attest and verify on the runner only;
#   dispatch `bump`     open the PR `chore(release): bump version A to B`
#                       from bot/release (Commitizen, .cz.toml);
#   merge that PR       the release: `make dist` builds and checks the asset
#                       (swarm-core-<ver>.tar.gz: core/ only, a CMake project;
#                       tools/release/dist.sh), then SBOM, checksums, signed
#                       provenance, the v<ver> tag and the GitHub release.
# The first release continues swarm-routing/swarm-adapter-ns3's line (v0.1.0 to
# v1.0.0 were released there): `first-release-from-config` bumps from .cz.toml's
# 1.0.0, so dispatch it with increment MAJOR for 2.0.0 (#10). After the publish:
# the `zenodo` job pushes the release to Zenodo (the push path, CONTRIBUTING
# "Releases and DOIs"; Zenodo's GitHub integration stays off for this
# repository), the first release creating swarm-core's own concept, and the
# `vcpkg` job opens the `swarm-core` port bump PR in swarm-routing/vcpkg-registry
# (swarm-routing/vcpkg-registry#50). The ns-3 module and its image ship from
# swarm-routing/swarm-adapter-ns3, not from here.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: bump, build, attest and verify on the runner only; bump: open the bump PR (merging it releases); release-notes: re-render the notes of the release `tag` from CHANGELOG.md"
        type: choice
        options: [dry-run, bump, release-notes]
        default: dry-run
      increment:
        description: "auto: the bump Commitizen reads from the commits; PATCH, MINOR or MAJOR force it (MAJOR for the first release here: 2.0.0, #10)"
        type: choice
        options: [auto, PATCH, MINOR, MAJOR]
        default: auto
      tag:
        description: "release-notes only: the existing release whose notes are re-rendered, vX.Y.Z (swarm-routing/.github#524)"
        type: string
        default: ''
  push:
    branches: [main]   # the merged bump PR releases; any other push is a no-op
permissions:
  contents: read
# One run per commit at a time, never cancelled (a later run must not replace
# a merged bump's pending release).
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
# org-sync:begin release-gate
    # Saves a runner on ordinary pushes; the workflow itself checks the PR.
    # Every commit of the push, never only its head: a merge queue batches the
    # bump PR below another (swarm-routing/.github#943, swarm-routing/.github#1012).
    # Quoted: the expression holds ': ', which YAML reads as a mapping in a plain scalar.
    if: "${{ github.event_name != 'push' || contains(toJSON(github.event.commits.*.message), 'chore(release): bump version ') }}"
# org-sync:end release-gate
    permissions: { contents: write, pull-requests: write, id-token: write, attestations: write }
    uses: swarm-routing/.github/.github/workflows/reusable-release.yml@4f6ed3217d05ebccd2418617fdcd99ab7869de8e # main@2026-11-27
    with:
      mode: ${{ inputs.mode }}   # empty on push: release
      increment: ${{ inputs.increment != 'auto' && inputs.increment || '' }}  # '' on push and for auto (swarm-routing/.github#211)
      tag: ${{ inputs.tag }}   # release-notes only; '' on push (swarm-routing/.github#524)
      first-release-from-config: true   # no v* tag here yet: continue from .cz.toml's 1.0.0 (swarm-routing/.github#636)
      zenodo: true   # the push path: swarm-core's own concept on the first release (#10)
      vcpkg-ports: swarm-core   # after publish, the org bot opens the port bump PR in swarm-routing/vcpkg-registry
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      ORG_BOT_TOKEN: ${{ secrets.ORG_BOT_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

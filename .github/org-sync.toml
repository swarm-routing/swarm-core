# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "c-cpp"
# bestpractices.dev project (OpenSSF Best Practices badge; id read from the site's public JSON, swarm-routing/.github#765)
bestpractices_project = "17075"
# the Zenodo concept record, read from Zenodo by swarm-routing/.github tools/zenodo/zenodo.py record (#232)
zenodo_concept = "24476619"
title = "swarm-core"
dual = [""]
# its port in swarm-routing/vcpkg-registry: the README's vcpkg badge (swarm-routing/.github#436);
# moved here from swarm-routing/swarm-adapter-ns3 with the releases (#10)
vcpkg_ports = ["swarm-core"]
# CITATION.cff seed and cite badge. The first release creates the Zenodo concept; org-bot's
# zenodo task then sets zenodo_concept (read from Zenodo) and CITATION.cff's doi (#10).
citation = true

[docs]
arena_id = "swarm-core"  # its id in swarm-routing.github.io site/hub/projects.json (swarm-routing/swarm-routing.github.io#312)

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "swarm-core: the pure C++23 ports every swarm-routing protocol core builds on (IClock, ITransport, IRouteTable, IEnergyProvider, ILocationProvider, ILinkMetrics), the 4-byte common wire envelope and header-only protocol contract tests; no OS or simulator headers."
homepage = "https://swarm-routing.github.io/projects/swarm-core/"
topics = ["cpp23", "swarm-intelligence", "routing-protocol", "ports-and-adapters", "hexagonal-architecture", "header-only", "manet", "library"]
ruleset = "protocol"
# Only checks that run on every PR today. Add the build and test checks (core, ns-3, ...)
# once their workflows exist and run on pull_request and merge_group.
required_checks = ["check / org-sync", "headers / licence", "title / title", "review / coderabbit", "core", "cxx-standard", "api-surface", "fuzz"]
# Checks that run on main but never gate a merge (swarm-routing/.github#780): the
# `core (<compiler>)` legs and `core checks` feed the required `core` job, so a
# compiler added to the matrix needs no settings change; `core (msvc, report-only)`
# is report-only (maintainer decision 18 of 2026-11-22); `doxygen / doxygen` does
# not run on merge_group; the rest are code scanning, review bots and push-only jobs.
optional_checks = ["core (*)", "core checks", "doxygen / doxygen", "Analyze (*)", "analysis / Scorecard analysis", "SonarCloud Code Analysis", "CodeRabbit", "autofix / pick", "notify"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true
